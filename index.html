<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SONIC RE-RUN - BACK FROM THE CODE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================================
         BOOT SCREEN
    ========================================================== -->

    <div id="bootScreen">

        <div class="bootLogo">
            SONIC RE-RUN
        </div>

        <div class="bootText">
            BACK FROM THE CODE
        </div>

        <div class="bootProgress">
            <div id="bootProgressBar"></div>
        </div>

        <div id="bootStatus">
            INITIALIZING...
        </div>

    </div>


    <!-- =========================================================
         TITLE SCREEN
    ========================================================== -->

    <main id="titleScreen" class="screen hidden">

        <div id="sonicBackground"></div>

        <div class="darkOverlay"></div>

        <div class="scanlines"></div>
        <div class="noise"></div>

        <div id="titleContent">

            <img
                id="titleLogo"
                class="titleLogo"
                draggable="false"
                alt="Sonic RE-RUN"
            >

            <img
                id="titleGlow"
                class="titleGlow"
                draggable="false"
                alt=""
            >

            <div id="pressEnter">
                PRESS&nbsp;&nbsp;&nbsp;ENTER
            </div>

        </div>

        <div id="titleVersion">
            SONIC RE-RUN 1.0000.4
        </div>

    </main>


    <!-- =========================================================
         MAIN MENU
    ========================================================== -->

    <main id="mainMenu" class="screen hidden">

        <div id="menuBackground"></div>

        <div class="menuOverlay"></div>

        <div class="menuHeader">

            <div class="menuTitle">
                SONIC RE-RUN
            </div>

            <div class="menuSubtitle">
                BACK FROM THE CODE
            </div>

        </div>


        <div id="menuOptions">

            <div class="menuOption selected" data-index="0">
                STORY MODE
            </div>

            <div class="menuOption" data-index="1">
                FREEPLAY
            </div>

            <div class="menuOption" data-index="2">
                OPTIONS
            </div>

            <div class="menuOption" data-index="3">
                CREDITS
            </div>

        </div>


        <div class="menuFooter">
            SONIC RE-RUN // VERSION 1.0000.4
        </div>

    </main>


    <!-- =========================================================
         SIMPLE PANELS
    ========================================================== -->

    <div id="panel" class="hidden">

        <div id="panelBox">

            <div id="panelTitle">
                SONIC RE-RUN
            </div>

            <div id="panelText"></div>

            <div id="panelBack">
                PRESS ESC TO RETURN
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
